<!DOCTYPE html>
<html>
<head>
    <title>Local Tracking Test</title>
</head>
<body>
    <h1>Local Tracking Test</h1>
    <p>This page simulates what the Netlify tracking page does, but runs on localhost so it can call your webhook.</p>
    
    <button onclick="testTracking()">Test Tracking with ID: 47cbbb</button>
    <div id="result"></div>

    <script>
        function testTracking() {
            const trackingData = {
                trackingId: "47cbbb",  // First 6 chars of your new email
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };
            
            console.log('Testing tracking with data:', trackingData);
            
            fetch('http://localhost:8080/webhooks/track-open', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(trackingData)
            }).then(response => {
                console.log('Response status:', response.status);
                return response.json();
            }).then(data => {
                console.log('Response data:', data);
                document.getElementById('result').innerHTML = '✅ Tracking successful: ' + JSON.stringify(data);
            }).catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
            });
        }
    </script>
</body>
</html>
