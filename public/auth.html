<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExaMark - Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .auth-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo h1 {
      color: #5a67d8;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    .logo p {
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 400;
    }
    
    .auth-tabs {
      display: flex;
      margin-bottom: 30px;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
    }
    
    .tab-button {
      flex: 1;
      background: none;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #64748b;
    }
    
    .tab-button.active {
      background: white;
      color: #5a67d8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 500;
      font-size: 0.9rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      background: white;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #5a67d8;
    }
    
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #5a67d8 0%, #667eea 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
      margin-bottom: 20px;
    }
    
    .submit-btn:hover {
      transform: translateY(-2px);
    }
    
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      border-left: 4px solid #dc2626;
    }
    
    .success-message {
      background: #d1fae5;
      color: #059669;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      border-left: 4px solid #059669;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .form-section {
      display: none;
    }
    
    .form-section.active {
      display: block;
    }
    
    .password-requirements {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 5px;
    }
    
    .guest-mode {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
    
    .guest-btn {
      background: none;
      border: 2px solid #5a67d8;
      color: #5a67d8;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .guest-btn:hover {
      background: #5a67d8;
      color: white;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="logo">
      <h1>ExaMark</h1>
      <p>AI-Powered Lead Research & Automation</p>
    </div>
    
    <div class="auth-tabs">
      <button class="tab-button active" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-button" onclick="switchTab('signup')">Sign Up</button>
    </div>
    
    <div id="error-message" class="error-message" style="display: none;"></div>
    <div id="success-message" class="success-message" style="display: none;"></div>
    
    <!-- Sign In Form -->
    <div id="signin-form" class="form-section active">
      <form onsubmit="handleSignIn(event)">
        <div class="form-group">
          <label for="signin-username">Username</label>
          <input type="text" id="signin-username" required>
        </div>
        
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" required>
        </div>
        
        <button type="submit" class="submit-btn" id="signin-btn">
          Sign In
        </button>
      </form>
    </div>
    
    <!-- Sign Up Form -->
    <div id="signup-form" class="form-section">
      <form onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" required minlength="3">
        </div>
        
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required>
        </div>
        
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required minlength="6">
          <div class="password-requirements">
            Minimum 6 characters required
          </div>
        </div>
        
        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" required minlength="6">
        </div>
        
        <button type="submit" class="submit-btn" id="signup-btn">
          Create Account
        </button>
      </form>
    </div>
    
    <div class="guest-mode">
      <p style="font-size: 0.9rem; color: #6b7280; margin-bottom: 10px;">
        Just want to try it out?
      </p>
      <button class="guest-btn" onclick="continueAsGuest()">
        Continue as Guest
      </button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      // Update tab buttons
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      // Update form sections
      document.querySelectorAll('.form-section').forEach(section => section.classList.remove('active'));
      document.getElementById(tab + '-form').classList.add('active');
      
      // Clear messages
      hideMessages();
    }
    
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      document.getElementById('success-message').style.display = 'none';
    }
    
    function showSuccess(message) {
      const successDiv = document.getElementById('success-message');
      successDiv.textContent = message;
      successDiv.style.display = 'block';
      document.getElementById('error-message').style.display = 'none';
    }
    
    function hideMessages() {
      document.getElementById('error-message').style.display = 'none';
      document.getElementById('success-message').style.display = 'none';
    }
    
    function setLoading(buttonId, loading) {
      const btn = document.getElementById(buttonId);
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span>';
      } else {
        btn.disabled = false;
        btn.innerHTML = buttonId === 'signin-btn' ? 'Sign In' : 'Create Account';
      }
    }
    
    async function handleSignIn(event) {
      event.preventDefault();
      
      const username = document.getElementById('signin-username').value;
      const password = document.getElementById('signin-password').value;
      
      setLoading('signin-btn', true);
      hideMessages();
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Store user info in localStorage
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          showSuccess('Sign in successful! Redirecting...');
          
          // Redirect to main app after short delay
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          showError(data.error || 'Sign in failed');
        }
      } catch (error) {
        showError('Network error. Please try again.');
        console.error('Sign in error:', error);
      } finally {
        setLoading('signin-btn', false);
      }
    }
    
    async function handleSignUp(event) {
      event.preventDefault();
      
      const username = document.getElementById('signup-username').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm-password').value;
      
      // Validate passwords match
      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }
      
      setLoading('signup-btn', true);
      hideMessages();
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showSuccess('Account created successfully! You can now sign in.');
          
          // Switch to sign in tab and clear form
          switchTab('signin');
          document.getElementById('signup-form').querySelector('form').reset();
        } else {
          showError(data.error || 'Registration failed');
        }
      } catch (error) {
        showError('Network error. Please try again.');
        console.error('Sign up error:', error);
      } finally {
        setLoading('signup-btn', false);
      }
    }
    
    function continueAsGuest() {
      // Set guest mode in localStorage
      localStorage.setItem('currentUser', JSON.stringify({
        userId: 'guest',
        username: 'Guest User',
        email: '',
        isGuest: true
      }));
      
      // Redirect to main app
      window.location.href = '/';
    }
    
    // Check if user is already logged in
    window.addEventListener('load', () => {
      const currentUser = localStorage.getItem('currentUser');
      if (currentUser) {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
