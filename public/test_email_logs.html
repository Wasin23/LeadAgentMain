<!DOCTYPE html>
<html>
<head>
    <title>Test Email Logs</title>
    <style>
        /* ChatGPT-style Clean Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* For Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="outreach-logs">Loading...</div>
    
    <script>
        async function loadOutreachLogs() {
            try {
                console.log('Loading outreach logs...');
                const response = await fetch('/email_logs.json');
                console.log('Response status:', response.status);
                const logs = await response.json();
                console.log('Loaded logs:', logs);
                const outreachContainer = document.getElementById('outreach-logs');
                
                if (logs.length === 0) {
                    outreachContainer.innerHTML = '<p style="color:#888;">No emails sent yet.</p>';
                    return;
                }
                
                let html = '<div style="font-size:0.9rem;">';
                logs.forEach(log => {
                    const date = new Date(log.timestamp).toLocaleString();
                    html += `
                        <div style="border:1px solid #444;margin:0.5rem 0;padding:0.8rem;border-radius:4px;background:#2a2b2e;">
                            <div style="color:#2196f3;font-weight:bold;margin-bottom:0.5rem;">📧 ${log.to}</div>
                            <div style="color:#888;font-size:0.8rem;margin-bottom:0.5rem;">${date}</div>
                            <div style="color:#fff;margin-bottom:0.5rem;"><strong>Subject:</strong> ${log.subject}</div>
                            <div style="color:#ccc;font-size:0.9rem;max-height:100px;overflow-y:auto;">${log.text || log.html || 'No content'}</div>
                        </div>
                    `;
                });
                html += '</div>';
                outreachContainer.innerHTML = html;
            } catch (error) {
                console.error('Error loading email logs:', error);
                document.getElementById('outreach-logs').innerHTML = '<p style="color:#f44336;">Error loading email logs: ' + error.message + '</p>';
            }
        }
        
        // Load on page load
        loadOutreachLogs();
    </script>
</body>
</html>
