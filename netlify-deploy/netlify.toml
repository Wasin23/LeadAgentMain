[build]
  command = "echo 'Static site deployment'"
  publish = "."

[[edge_functions]]
  function = "track-pixel"
  path = "/track/pixel/*"

[[headers]]
  for = "/track/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
