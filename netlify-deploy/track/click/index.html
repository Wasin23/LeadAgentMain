<!DOCTYPE html>
<html>
<head>
    <title>Email Click Tracking</title>
</head>
<body>
    <script>
        // Get tracking ID and URL from current page
        const pathParts = window.location.pathname.split('/');
        const trackingId = pathParts[pathParts.length - 1];
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('url') || 'https://examarkchat.com';
        
        // Send tracking data with dual system
        if (trackingId && trackingId !== 'click') {
            const trackingData = {
                trackingId: trackingId,
                url: redirectUrl,
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };
            
            // Option 1: Try Netlify Function (HTTPS) - BEST for Gmail
            fetch('/.netlify/functions/track-click', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(trackingData)
            }).then(response => {
                if (response.ok) {
                    console.log('✅ Click tracking sent via Netlify Function');
                    return response.json();
                } else {
                    console.log('⚠️ Netlify Function failed, status:', response.status);
                    throw new Error('Netlify Function failed');
                }
            }).then(data => {
                console.log('🔗 Click tracking response:', data);
            }).catch(error => {
                console.log('❌ Netlify Function failed:', error.message);
                
                // Fallback: Try direct localhost
                fetch('http://localhost:8080/webhooks/track-click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(trackingData)
                }).then(response => {
                    if (response.ok) {
                        console.log('✅ Click tracking sent to localhost (fallback)');
                    } else {
                        console.log('⚠️ Localhost click tracking failed, status:', response.status);
                    }
                }).catch(error => {
                    console.log('❌ Localhost click tracking failed (expected from HTTPS):', error.message);
                });
            });
        }
        
        // Redirect after a short delay
        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 100);
    </script>
    <p>Redirecting...</p>
</body>
</html>
