<!DOCTYPE html>
<html>
<head>
    <title>Email Image</title>
    <style>body{margin:0;padding:0;}</style>
</head>
<body>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAMAAAADCAYAAABWKLW/AAAAGklEQVR42mP8//8/AzYwOjKC4X/G/4zYwGAAAE+AAUG4HQbBAAAAAElFTkSuQmCC" width="3" height="3" style="opacity:0.1;">
    
    <script>
        // Try to extract tracking ID from URL - handle both old and new formats
        let trackingId = '';
        const pathname = window.location.pathname;
        
        if (pathname.includes('/track/pixel/')) {
            // Old format: /track/pixel/abc123.png
            const pathParts = pathname.split('/');
            trackingId = pathParts[pathParts.length - 1].replace('.png', '');
        } else if (pathname.includes('/images/spacer-')) {
            // New format: /images/spacer-abc12345.png  
            const match = pathname.match(/spacer-([a-f0-9]+)\.png/);
            if (match) {
                // Reconstruct full tracking ID from shortened version
                const shortId = match[1];
                // For now, just use the short ID and let the server figure it out
                trackingId = shortId;
            }
        }
        
        // Store tracking data in console for now
        if (trackingId && trackingId !== 'pixel') {
            console.log('📧 Email opened:', trackingId);
            console.log('User agent:', navigator.userAgent);
            console.log('Timestamp:', new Date().toISOString());
            
            // Dual tracking system - try both Render and localhost
            const trackingData = {
                trackingId: trackingId,
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };
            
            // Option 1: Try Render (production)
            fetch('https://examark-ga2o.onrender.com/webhooks/track-open', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(trackingData)
            }).then(response => {
                if (response.ok) {
                    console.log('✅ Tracking sent to Render');
                } else {
                    console.log('⚠️ Render tracking failed, status:', response.status);
                }
            }).catch(error => {
                console.log('❌ Render tracking failed:', error.message);
            });
            
            // Option 2: Try localhost (development/testing)
            // Note: This will fail from HTTPS but works for testing direct access
            fetch('http://localhost:8080/webhooks/track-open', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(trackingData)
            }).then(response => {
                if (response.ok) {
                    console.log('✅ Tracking sent to localhost');
                } else {
                    console.log('⚠️ Localhost tracking failed, status:', response.status);
                }
            }).catch(error => {
                console.log('❌ Localhost tracking failed (expected from HTTPS):', error.message);
            });
        }
    </script>
</body>
</html>
